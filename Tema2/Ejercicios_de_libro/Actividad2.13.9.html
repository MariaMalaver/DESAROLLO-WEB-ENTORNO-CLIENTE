<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 9</title>
    </head>

    <body>

        <h1>Contenido del array</h1>

        <script>

            var milista = ["panadero", 456, [0, 1, 2]];

            document.write("Contenido del array: " + milista + "<br>");

            document.write("Primera posición: " + milista[0] + "<br>");
            document.write("Segunda posición: " + milista[1] + "<br>");
            document.write("Tercera posición: " + milista[2] + "<br>");

            document.write("milista[2][0]: " + milista[2][0] + "<br>");
            document.write("milista[2][1]: " + milista[2][1] + "<br>");
            document.write("milista[2][2]: " + milista[2][2] + "<br>");

        </script>

    </body>
</html>
