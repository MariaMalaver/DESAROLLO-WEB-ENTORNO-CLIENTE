<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>lista de tareas</title>
    </head>
    <body>
        <!--
            Funciones anadirTarea(texto) y verTareas() que guarden un array de tareas en localStorage. Tras recargar, verTareas() debe mostrar las mismas.
            Pista: JSON.stringify para guardar el array y JSON.parse para recuperarlo
        -->
        <script>
            const addTareaBtn = document.getElementById("addTarea");
            const nuevaTareaInput = document.getElementById("nuevaTarea");
            const clearBtn = document.getElementById("clearTarea");
            const consoleShowBtn = document.getElementById("consoleShow");

            const anadirTarea = texto => {
                let tareasItem = JSON.parse(localStorage.getItem("tareas")) || { tareas: []};
                tareasItem.tareas.push(texto);
                localStorage.setItem("tareas", JSON.stringify(tareasItem));
            }

            const verTareas = () => console.log(JSON.parse(localStorage.getItem("tareas")));

            addTareaBtn.addEventListener("click", () => {anadirTarea(nuevaTareaInput.value);});
            clearBtn.addEventListener("click", localStorage.clear());

            consoleShowBtn.addEventListener("click", verTareas);
        </script>
    </body>
</html>
