<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Parámetros y recursividad</title>
    </head>
    <body>
        <script>
            function saludar(nombre = "invitado") {
                return "Hola, " + nombre;
            }
            console.log(saludar());
            console.log(saludar("Maria")); 
            
            function cuentaAtras(n) {
                if (n < 0) return;
                console.log(n);
                cuentaAtras(n - 1);
            }
            cuentaAtras(5);
        </script>
    </body>
</html>
