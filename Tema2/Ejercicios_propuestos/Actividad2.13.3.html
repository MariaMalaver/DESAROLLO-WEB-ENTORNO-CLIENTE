<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Operador ternario</title>
</head>

    <body>
        <h1>Operador ternario</h1>
        <!-- 
            3. Ejecuta las siguientes dos líneas de código y comprueba el contenido de la variable var. 
            Interpreta y explica los resultados: var dato = “Ronaldo “ + 5 + 5; var dato = 5 + 5 + “ Ronaldo “; 
        -->
        <script>
            var dato1 = "Ronaldo " + 5 + 5;
            var dato2 = 5 + 5 + " Ronaldo ";

            document.write("Resultado de la primera operación: " + dato1);
            document.write("<br>");
            document.write("Resultado de la segunda operación: " + dato2);
        </script>

    </body>
</html>
