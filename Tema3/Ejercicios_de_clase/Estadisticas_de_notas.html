<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Estadisticas de notas</title>
    </head>
    <body>
        <!--Con const notas = [6, 3.5, 8, 9.5, 4, 7],
            obtén las aprobadas (filter), la media
            con dos decimales y la nota más
            alta (reduce).
            Pista: toFixed(2) para los decimales;
            en reduce compara el acumulado con
            cada nota.
        -->
        <script>
            const notas = [6, 3.5, 8, 9.5, 4, 7];

            const aprobadas = notas.filter(nota => nota >= 5);
            console.log(aprobadas);

            const suma = notas.reduce((acum, nota) => acum + nota, 0);
            const media = (suma / notas.length).toFixed(2);
            console.log(media);

            const maxima = notas.reduce((acum, nota) => (nota > acum ? nota : acum), notas[0]);
            console.log(maxima);
        </script>
    </body>
</html>
