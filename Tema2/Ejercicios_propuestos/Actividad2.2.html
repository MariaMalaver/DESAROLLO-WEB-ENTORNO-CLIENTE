<!DOCTYPE html>
    <html lang="es">
        <head>
            <meta charset="UTF-8">
            <title>Persona</title>
        </head>
    <body>
        <!--
            Crea una página web con un script que contenga un objeto de la clase persona, la cual tendrá los siguientes atributos: 
            
            Nombre: Dimas.
            Edad: 28.
            Altura: 185.

            Una vez creado el objeto, se deberá mostrar por consola: “El usuario Dimas
            tiene 28 años y mide 185 centímetros”.
            Todo ello utilizando los atributos del objeto.
        -->
        <h1>Información de la persona</h1>
        <script>

            var persona = 
            {
                nombre: "Dimas",
                edad: 28,
                altura: 185
            };

            console.log("El usuario " + persona.nombre + " tiene " + persona.edad + " años y mide " + persona.altura + " centímetros");
        </script>
    </body>
</html>
