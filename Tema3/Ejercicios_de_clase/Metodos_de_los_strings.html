<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recorrer y transformar arrays</title>
    </head>
    <body>
        <script>
            const s = "  Desarrollo Web  ";
            s.length; // 18
            s.trim(); // "Desarrollo Web"
            s.trim().toUpperCase(); // "DESARROLLO WEB"
            "JavaScript".slice(0, 4); // "Java"
            "JavaScript".includes("Script"); // true
            "JavaScript".indexOf("a"); // 1 (−1 si no está)
            "a,b,c".split(","); // ["a", "b", "c"]
            "7".padStart(3, "0"); // "007"
            "hola mundo".replaceAll("o", "0"); // "h0la mund0
        </script>
    </body>
