<!DOCTYPE html>
<html>
<body>
    <h1>Prueba de Métodos de Salida en JavaScript</h1>
    <p id="mytxt">Contenido previo</p>
    <button type="button" onclick="probarAlerta()">1. Ventana Alerta</button>
    <button type="button" onclick="probarConsola()">2. Mensaje en Consola</button>
    <button type="button" onclick="probarInnerHTML()">3. Modificar DOM (innerHTML)</button>
    <button type="button" onclick="probarDocumentWrite()">4. Document Write</button>

    <script>
        function probarAlerta() 
        {
            window.alert("Esto es una alerta");
        }

        function probarConsola() 
        {
            console.log("¡Hola, mundo!");
            alert("Mensaje enviado a la consola. Abre la consola del navegador para verlo.(f12)");
        }

        function probarInnerHTML() 
        {
            document.getElementById("contenedor").innerHTML = "<strong>Texto inyectado con innerHTML</strong>";
        }

        function probarDocumentWrite() 
        {
            document.write("<h3>Texto inyectado con document.write</h3>");

        }
    </script>
</body>
</html>
