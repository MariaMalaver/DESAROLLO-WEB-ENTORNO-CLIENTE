<!DOCTYPE html>
<html>
<body>
    <h1>Prueba de Métodos de Salida en JavaScript</h1>
    <p id="mytxt">Contenido previo</p>
    <button type="button" onclick="btn1()">1. Ventana Alerta</button>
    <button type="button" onclick="btn2()">2. Mensaje en Consola</button>
    <button type="button" onclick="btn3()">3. Modificar DOM (innerHTML)</button>
    <button type="button" onclick="btn4()">4. Document Write</button>

    <script>
        function btn1() 
        {
            alert("Hola, mundo!");
        }

        function btn2() 
        {
            console.log("¡Hola, mundo!");
        }

        function btn3() 
        {
            var x = document.getElementById("mytxt");
            x.style.cssText = "font-size: 35px; color: pink; font-weight: bold;";
        }

        function btn4() 
        {
            document.write(" ");
        }
    </script>
</body>
</html>
