<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Clase Producto</title>
</head>
<body>
  <h1>Clase Producto</h1>
  <ul id="salida"></ul>

<script>
  class Producto {
    constructor(nombre, precio, stock) {
      this.nombre = nombre;
      this.precio = precio;
      this.stock = stock;
    }

    conIVA() {
      return this.precio * 1.21;
    }

    vender(n) {
      if (n <= this.stock) {
        this.stock -= n;
        return true;
      }
      return false;
    }
  }

  const salida = document.getElementById("salida");
  function mostrar(texto) {
    const li = document.createElement("li");
    li.textContent = texto;
    salida.appendChild(li);
    console.log(texto);
  }

  const teclado = new Producto("Teclado", 20, 5);

  mostrar("Precio sin IVA: " + teclado.precio + " €");
  mostrar("Precio con IVA: " + teclado.conIVA().toFixed(2) + " €");
  mostrar("Stock inicial: " + teclado.stock);

  mostrar("vender(3): " + teclado.vender(3) + " → stock " + teclado.stock);
  mostrar("vender(3): " + teclado.vender(3) + " → stock " + teclado.stock);
  mostrar("vender(2): " + teclado.vender(2) + " → stock " + teclado.stock);
</script>
</body>
</html>
