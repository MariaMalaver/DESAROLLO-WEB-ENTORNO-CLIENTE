<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Operador ternario</title>
    </head>
    <body>
        <h1>Operador ternario</h1>
        <!-- 2. Investiga el operador ternario y pon un ejemplo de su uso-->
        
        <!-- 
            Un operador ternario es una forma abreviada de escribir una instrucción if-else y 
            tiene la siguiente sintaxis: condición ? valor_si_es_verdadera : valor_si_es_falsa 
        -->
        <script>

            var edad = 20;

            var resultado = edad >= 18 ? "Es mayor de edad" : "Es menor de edad";

            document.write(resultado);
        </script>
    </body>
</html>
