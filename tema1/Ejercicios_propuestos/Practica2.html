<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Secuencia de imágenes</title>
</head>
<body>

    <h1>Secuencia de imágenes</h1>

    <p>Haz clic sobre la imagen para reproducir la secuencia.</p>

    <img id="fotograma"+ src="imagen1.jpg" alt="Fotograma 1"+ width="400"+ onclick="siguienteFotograma()">
    <p id="contador">Fotograma 1 de 4</p>

    <script>
        let fotogramaActual = 1;

        function siguienteFotograma() 
        {
            fotogramaActual++;

            if (fotogramaActual > 4) 
            {
                fotogramaActual = 1;
            }

            document.getElementById("fotograma").src = "imagen" + fotogramaActual + ".jpg";

            document.getElementById("fotograma").alt = "Fotograma " + fotogramaActual;

            document.getElementById("contador").innerHTML = "Fotograma " + fotogramaActual + " de 4";
        }
    </script>
</body>
</html>
