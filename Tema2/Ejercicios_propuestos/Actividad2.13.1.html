<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Circunferencia</title>
</head>

    <body>
        <h1>Cálculo de la circunferencia</h1>
        <!-- 1. Realiza un programa JavaScript que calcule el área y la longitud de una circunferencia de radio 5. -->
        <script>

            var radio = 5;
            var numeroPi = 3.14;

            var area = numeroPi * radio * radio;
            var longitud = 2 * numeroPi * radio;

            document.write("Área de la circunferencia: " + area);
            document.write("<br>");
            document.write("Longitud de la circunferencia: " + longitud);
        </script>

    </body>
</html>
