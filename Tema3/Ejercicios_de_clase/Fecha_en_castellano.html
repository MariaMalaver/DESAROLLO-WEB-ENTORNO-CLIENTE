<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fecha en castellano</title>
    <body>
        <!--
            Muestra por consola la fecha de hoy con el formato «lunes, 19 de octubre de
            2026». Pista: dos arrays con los nombres de días y meses: dias[hoy.getDay()].
        -->
        <script>
            const dias = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
            const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

            const hoy = new Date();
            const dia = dias[hoy.getDay()];
            const diaNumero = hoy.getDate();
            const mes = meses[hoy.getMonth()];
            const año = hoy.getFullYear();

            console.log(`${dia}, ${diaNumero} de ${mes} de ${año}`);
        </script>
    </body>
</html>
