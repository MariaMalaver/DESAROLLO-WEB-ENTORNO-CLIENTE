<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 2.2</title>
</head>

<body>
    <!--Vista la funcion suma, realiza la funció resta, multiplicacion y division-->

    <h1>Operaciones</h1>

    <label>Número 1:</label>
    <input type="number" id="numero1">

    <br><br>

    <label>Número 2:</label>
    <input type="number" id="numero2">

    <br><br>

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>

        function suma(a, b) {
            return a + b;
        }

        function resta(a, b) {
            return a - b;
        }

        function multiplicacion(a, b) {
            return a * b;
        }

        function division(a, b) {
            return a / b;
        }

        function calcular() {

            var numero1 = Number(document.getElementById("numero1").value);
            var numero2 = Number(document.getElementById("numero2").value);

            document.getElementById("resultado").innerHTML =
                "Suma: " + suma(numero1, numero2) + "<br>" +
                "Resta: " + resta(numero1, numero2) + "<br>" +
                "Multiplicación: " + multiplicacion(numero1, numero2) + "<br>" +
                "División: " + division(numero1, numero2);
        }

    </script>

</body>
</html>
